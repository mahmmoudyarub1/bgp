<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGP Path Trace</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 850px; background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        h2 { text-align: center; margin-bottom: 25px; color: #38bdf8; }
        .search-box { display: flex; gap: 10px; margin-bottom: 30px; }
        input { flex: 1; padding: 12px 15px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 16px; outline: none; }
        button { padding: 12px 25px; border-radius: 6px; border: none; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; }
        button:hover { background: #0369a1; }
        .result-card { background: #0f172a; border-radius: 8px; padding: 20px; margin-top: 20px; border: 1px solid #334155; }
        .info-header { font-size: 18px; line-height: 1.8; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px; }
        .highlight { color: #38bdf8; font-weight: bold; }
        .asn-badge { background: #0369a1; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .path-visual { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 15px; background: #1e293b; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 16px; color: #4ade80; }
        .arrow { color: #94a3b8; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: right; padding: 12px; border-bottom: 1px solid #334155; }
        th { color: #94a3b8; background: #1e293b; }
        .error { color: #f87171; text-align: center; padding: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>استعلام مسارات BGP</h2>
        <div class="search-box">
            <input type="text" id="ipInput" value="91.205.42.55" placeholder="أدخل IP هنا (مثال: 91.205.42.55)">
            <button onclick="traceIP()">فحص المسار</button>
        </div>

        <div id="loading" style="display:none; text-align:center; color:#94a3b8;">جاري الاستعلام من شبكات BGP...</div>
        <div id="errorBox" class="error" style="display:none;"></div>

        <div id="result" style="display:none;">
            <div class="result-card">
                <div class="info-header">
                    الـ IP المطلوب: <span id="outIp" class="highlight"></span><br>
                    الـ ASN التابع له: <span id="outAsn" class="asn-badge"></span><br>
                    اسم الشركة/الشبكة: <span id="outHolder" class="highlight"></span>
                </div>

                <div><b>المسار الكامل (AS-Path):</b></div>
                <div id="pathPipeline" class="path-visual"></div>

                <h4 style="margin-top: 25px; color: #94a3b8;">تفاصيل الشبكات المارة بالمسار:</h4>
                <table>
                    <thead>
                        <tr>
                            <th>الترتيب</th>
                            <th>الـ ASN</th>
                            <th>اسم الشركة / الشبكة (Holder)</th>
                        </tr>
                    </thead>
                    <tbody id="nodesTable"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function traceIP() {
            const ip = document.getElementById('ipInput').value.trim();
            const loading = document.getElementById('loading');
            const errorBox = document.getElementById('errorBox');
            const result = document.getElementById('result');

            if (!ip) return;

            loading.style.display = 'block';
            errorBox.style.display = 'none';
            result.style.display = 'none';

            try {
                const res = await fetch(`/api/trace?ip=${ip}`);
                const data = await res.json();
                loading.style.display = 'none';

                if (data.error) {
                    errorBox.innerText = data.error;
                    errorBox.style.display = 'block';
                    return;
                }

                document.getElementById('outIp').innerText = data.target_ip;
                document.getElementById('outAsn').innerText = data.target_asn;
                document.getElementById('outHolder').innerText = data.target_holder;

                // Path Pipeline (e.g. AS3452 -> AS234 -> AS234)
                document.getElementById('pathPipeline').innerHTML = data.as_path.join(' <span class="arrow">➔</span> ');

                // Table Rows
                const tableBody = document.getElementById('nodesTable');
                tableBody.innerHTML = '';
                data.nodes.forEach((node, idx) => {
                    const row = `<tr>
                        <td>${idx + 1}</td>
                        <td><span class="asn-badge">${node.asn}</span></td>
                        <td>${node.name}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });

                result.style.display = 'block';
            } catch (err) {
                loading.style.display = 'none';
                errorBox.innerText = "فشل في الاتصال بالسيرفر";
                errorBox.style.display = 'block';
            }
        }

        traceIP();
    </script>
</body>
</html>
